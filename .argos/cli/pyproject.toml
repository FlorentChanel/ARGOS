[project]
name = "argos-cli"
version = "0.2.0"
description = "A command-line interface for ARGOS"
requires-python = ">=3.12"

[tool.basedpyright]
typeCheckingMode = "strict"
reportUnusedExpression = "error"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "COM", "C4", "ANN", "S", "N", "LOG", "G", "T20"]
ignore = ["ANN204", "COM812"]
